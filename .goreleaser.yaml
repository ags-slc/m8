version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ags-slc/m8/cmd.version={{.Version}}
      - -X github.com/ags-slc/m8/cmd.commit={{.ShortCommit}}
      - -X github.com/ags-slc/m8/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Cosign keyless signing via Sigstore + GitHub OIDC.
# Signs the checksums file (which covers all artifacts transitively).
#
# cosign v3 writes a single Sigstore bundle (.sigstore.json) holding the
# certificate, the signature and the transparency-log entry; the separate
# .pem/.sig pair is gone, and --output-certificate/--output-signature are
# deprecated and ignored.
#
# Verify with cosign >= v2.4.2 (older v2 releases cannot read the bundle):
#   cosign verify-blob \
#     --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/ags-slc/m8/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap (cask — the formula path is deprecated in GoReleaser).
# Works on macOS and Linux (Homebrew supports casks on both since brew 4.x).
# Prereqs (one-time):
#   1. Create github.com/ags-slc/homebrew-tap (empty repo is fine).
#   2. Create a fine-grained PAT with Contents:write on ags-slc/homebrew-tap.
#   3. Add it as repository secret HOMEBREW_TAP_GITHUB_TOKEN.
# After release, users can: brew install ags-slc/tap/m8
homebrew_casks:
  - repository:
      owner: ags-slc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    name: m8
    homepage: "https://github.com/ags-slc/m8"
    description: "PostgreSQL migration tool"
    license: "Apache-2.0"
    binaries:
      - m8
    # Strip macOS quarantine attr so unsigned binaries from a download
    # don't trip Gatekeeper. Standard cask boilerplate for CLI tools.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/m8"]
          end
