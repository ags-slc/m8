version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Zonos/m8/cmd.version={{.Version}}
      - -X github.com/Zonos/m8/cmd.commit={{.ShortCommit}}
      - -X github.com/Zonos/m8/cmd.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: Zonos
      name: homebrew-tap
    name: m8
    homepage: "https://github.com/Zonos/m8"
    description: "PostgreSQL migration tool"
    install: |
      bin.install "m8"
    test: |
      system "#{bin}/m8", "version"
